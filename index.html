<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE4">
<title>ملاك العقار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --brand:#0D7377; --on-brand:#FFFFFF; --brand-soft:#DDF1EF; --brand-bright:#3CBFBA;
  --gold:#C9A267; --gold-text:#7A5A1F; --surface:#F5EFE4; --raised:#FFFFFF;
  --ink:#1B2F5B; --muted:#5B6478; --line:#E6DCCB; --ok:#2E7D4F; --danger:#B3261E;
  --kufi:"Noto Kufi Arabic","IBM Plex Sans Arabic",system-ui,sans-serif;
  --sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 32px}
.view{display:none}.view.on{display:block}
h1,h2{font-family:var(--kufi);font-weight:700;margin:0}
button,input{font-family:inherit;font-size:15px}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--brand-bright);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 4px}
.top img{width:112px;height:80px;object-fit:cover;border-radius:8px}
.iconbtn{min-width:44px;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink);display:inline-flex;align-items:center;gap:6px;font-weight:600;cursor:pointer}

/* home */
.hello{margin:8px 0 14px}
.hello p{margin:0;font-size:13px;color:var(--muted)}
.hello h1{font-size:22px;line-height:34px;margin-top:2px}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--raised)}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--ink)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#EAE2D3;margin-top:12px}
.seg button{flex:1;height:40px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.cta{display:flex;align-items:center;gap:14px;padding:16px;border-radius:12px;background:var(--brand);color:var(--on-brand);margin-top:14px}
.cta div{flex:1}
.cta strong{display:block;font-family:var(--kufi);font-size:16px;line-height:26px}
.cta span{font-size:13px;line-height:20px;color:#E3F4F2}
.cta button{flex:0 0 auto;height:44px;padding:0 14px;border-radius:12px;border:none;background:var(--raised);color:var(--brand);font-weight:600;cursor:pointer}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.sechead h2{font-size:17px;line-height:28px}
.list{display:grid;gap:14px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ph{position:relative;height:180px;background:#DCE7E6;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover}
.badges{position:absolute;top:12px;right:12px;display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill.deal{background:var(--brand);color:var(--on-brand)}
.pill.owner{background:var(--raised);color:var(--gold-text)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.price{font-family:var(--kufi);font-size:20px;line-height:28px}
.price small{font-family:var(--sans);font-size:13px;color:var(--muted);font-weight:400;margin-right:4px}
.body h3{margin:0;font-size:15px;line-height:24px;font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.specs{display:flex;gap:14px;font-size:13px}
.empty{padding:28px 16px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--raised)}
.empty p{margin:0 0 12px;color:var(--muted);line-height:24px}

/* forms */
.formtop{display:flex;align-items:center;gap:8px;padding:10px 0}
.formtop h1{font-size:18px;line-height:28px}
.brandhead{display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 0 8px;text-align:center}
.brandhead img{width:220px;height:157px;object-fit:cover;border-radius:16px}
.brandhead h1{font-size:20px;line-height:32px}
.brandhead p{margin:0;color:var(--muted);font-size:14px;line-height:22px}
form{display:flex;flex-direction:column;gap:14px;margin-top:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
label.f input{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font-weight:400}
label.f small{font-weight:400;color:var(--muted);font-size:12px;line-height:18px}
fieldset{border:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:13px;font-weight:600;padding:0 0 8px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--raised);cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input,.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--brand);flex:0 0 auto}
.opt b{display:block;font-size:14px}.opt span{font-size:12px;color:var(--muted);line-height:18px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:20px;min-height:44px}
.primary{height:52px;border-radius:12px;border:none;background:var(--brand);color:var(--on-brand);font-size:16px;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.6}
.secondary{display:flex;align-items:center;justify-content:center;height:52px;border-radius:12px;border:1px solid var(--brand);background:var(--raised);color:var(--brand);font-size:16px;font-weight:600;text-decoration:none}
.link{display:inline-flex;align-items:center;min-height:44px;font-size:14px;font-weight:600;color:var(--brand);background:none;border:none;padding:0;cursor:pointer;text-decoration:none}
.muted{color:var(--muted);font-weight:400}
.or{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin:18px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:none;padding:10px 12px;border-radius:10px;font-size:13px;line-height:20px}
.msg.err{display:block;background:#FBE9E7;color:var(--danger)}
.msg.ok{display:block;background:#E5F3EA;color:var(--ok)}
.center{text-align:center}
</style>
</head>
<body>

<!-- ============ الرئيسية ============ -->
<main id="view-home" class="view wrap">
  <header class="top">
    <img src="logo.jpg" alt="ملاك العقار">
    <a id="accountBtn" class="iconbtn" href="#login">دخول</a>
  </header>
  <section class="hello">
    <p id="helloName">مرحباً بك</p>
    <h1>عقارك من مالكه… مباشرة</h1>
  </section>
  <label class="search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6478" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input id="q" type="search" placeholder="ابحث بالمدينة أو الحي أو نوع العقار" aria-label="بحث">
  </label>
  <div class="seg" id="dealSeg">
    <button type="button" data-deal="all" aria-pressed="true">الكل</button>
    <button type="button" data-deal="sale" aria-pressed="false">للبيع</button>
    <button type="button" data-deal="rent" aria-pressed="false">للإيجار</button>
  </div>
  <div class="chips" id="typeChips"></div>
  <div class="cta">
    <div><strong>عندك عقار؟</strong><span>اعرضه بنفسك، وأنت اللي تقرر مين يعاينه.</span></div>
    <button type="button" id="addBtn">أضف عقارك</button>
  </div>
  <div class="sechead"><h2>أحدث العروض</h2><span class="meta" id="count"></span></div>
  <div class="list" id="list"><p class="meta">جاري تحميل العروض…</p></div>
</main>

<!-- ============ تسجيل الدخول ============ -->
<main id="view-login" class="view wrap">
  <div class="brandhead">
    <img src="logo.jpg" alt="ملاك العقار">
    <h1>أهلاً بك</h1>
    <p>سجّل دخولك لتتواصل مع الملاك أو تعرض عقارك.</p>
  </div>
  <form id="loginForm" novalidate>
    <div class="msg" id="loginMsg" role="alert"></div>
    <label class="f">البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
    <label class="f">كلمة المرور<input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••" required></label>
    <button type="button" class="link" id="forgotBtn">نسيت كلمة المرور؟</button>
    <button type="submit" class="primary" id="loginSubmit">دخول</button>
  </form>
  <div class="or">أو</div>
  <a class="secondary" href="#signup">إنشاء حساب جديد</a>
  <p class="center"><a class="link muted" href="#home">تصفح العقارات بدون حساب</a></p>
</main>

<!-- ============ إنشاء حساب ============ -->
<main id="view-signup" class="view wrap">
  <div class="formtop">
    <a class="iconbtn" href="#login" aria-label="رجوع">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2F5B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
    <h1>إنشاء حساب</h1>
  </div>
  <form id="signupForm" novalidate>
    <div class="msg" id="signupMsg" role="alert"></div>
    <fieldset>
      <legend>وش تبي من التطبيق؟</legend>
      <label class="opt"><input type="radio" name="role" value="buyer" checked><span><b>أبحث عن عقار</b><span>شراء أو إيجار، وطلب معاينة من المالك مباشرة.</span></span></label>
      <label class="opt"><input type="radio" name="role" value="owner"><span><b>عندي عقار أعرضه</b><span>أضيف عقاري وأتحكم بمن يعاينه.</span></span></label>
      <label class="opt"><input type="radio" name="role" value="both"><span><b>الاثنين</b><span>تقدر تغيّرها لاحقاً من حسابك.</span></span></label>
    </fieldset>
    <label class="f">الاسم<input id="suName" type="text" autocomplete="name" placeholder="الاسم الأول واسم العائلة" required></label>
    <label class="f">رقم الجوال<input id="suPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="05xxxxxxxx" required><small>ما يظهر لأحد إلا بعد موافقتك ودفع رسوم الخدمة.</small></label>
    <label class="f">البريد الإلكتروني<input id="suEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
    <label class="f">كلمة المرور<input id="suPass" type="password" autocomplete="new-password" placeholder="8 أحرف على الأقل" required></label>
    <label class="check"><input id="suTerms" type="checkbox">أوافق على شروط الاستخدام وسياسة الخصوصية.</label>
    <button type="submit" class="primary" id="signupSubmit">إنشاء الحساب</button>
    <p class="center muted">عندك حساب؟ <a class="link" href="#login">سجّل دخولك</a></p>
  </form>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         updateProfile, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, doc, setDoc, serverTimestamp }
         from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0AQcVv-CeK4Q4kq5qgDVh_qNNX7A_KhI",
  authDomain: "malak-alaqar.firebaseapp.com",
  projectId: "malak-alaqar",
  storageBucket: "malak-alaqar.firebasestorage.app",
  messagingSenderId: "1034402733452",
  appId: "1:1034402733452:web:1a942c428619988ed3caa9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

/* ---------- التنقل بين الشاشات ---------- */
function route(){
  const name = (location.hash || "#home").slice(1);
  const v = ["home","login","signup"].includes(name) ? name : "home";
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "view-" + v));
  window.scrollTo(0,0);
}
addEventListener("hashchange", route); route();

/* ---------- الحساب ---------- */
let currentUser = null;
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  const btn = $("accountBtn");
  if (user){
    $("helloName").textContent = "مرحباً " + (user.displayName || "");
    btn.textContent = "خروج"; btn.href = "#home";
    btn.onclick = async (e) => { e.preventDefault(); await signOut(auth); };
    if (location.hash === "#login" || location.hash === "#signup") location.hash = "#home";
  } else {
    $("helloName").textContent = "مرحباً بك";
    btn.textContent = "دخول"; btn.href = "#login"; btn.onclick = null;
  }
});

const errText = (code) => ({
  "auth/invalid-email":"صيغة البريد الإلكتروني غير صحيحة.",
  "auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة.",
  "auth/wrong-password":"البريد أو كلمة المرور غير صحيحة.",
  "auth/user-not-found":"ما فيه حساب بهذا البريد. أنشئ حساب جديد.",
  "auth/email-already-in-use":"هذا البريد مسجّل من قبل. سجّل دخولك بدل إنشاء حساب.",
  "auth/weak-password":"كلمة المرور ضعيفة. اكتب 8 أحرف على الأقل.",
  "auth/too-many-requests":"محاولات كثيرة. انتظر شوي ثم جرّب مرة ثانية.",
  "auth/network-request-failed":"تأكد من اتصالك بالإنترنت ثم جرّب مرة ثانية."
}[code] || "صار خطأ غير متوقع. جرّب مرة ثانية.");
const show = (el, text, ok=false) => { el.textContent = text; el.className = "msg " + (ok ? "ok" : "err"); };

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("loginMsg"), btn = $("loginSubmit");
  btn.disabled = true; btn.textContent = "جاري الدخول…";
  try { await signInWithEmailAndPassword(auth, $("loginEmail").value.trim(), $("loginPass").value); }
  catch(err){ show(msg, errText(err.code)); }
  btn.disabled = false; btn.textContent = "دخول";
});

$("forgotBtn").addEventListener("click", async () => {
  const msg = $("loginMsg"), email = $("loginEmail").value.trim();
  if (!email) return show(msg, "اكتب بريدك الإلكتروني أولاً، ثم اضغط «نسيت كلمة المرور؟».");
  try { await sendPasswordResetEmail(auth, email); show(msg, "أرسلنا لك رابط تغيير كلمة المرور على بريدك.", true); }
  catch(err){ show(msg, errText(err.code)); }
});

$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("signupMsg"), btn = $("signupSubmit");
  const name = $("suName").value.trim();
  const phone = $("suPhone").value.replace(/\D/g,"");
  const email = $("suEmail").value.trim();
  const pass = $("suPass").value;
  const role = document.querySelector('input[name="role"]:checked').value;
  if (name.length < 2) return show(msg, "اكتب اسمك.");
  if (!/^05\d{8}$/.test(phone)) return show(msg, "رقم الجوال لازم يبدأ بـ05 ويتكون من 10 أرقام.");
  if (pass.length < 8) return show(msg, "كلمة المرور لازم تكون 8 أحرف على الأقل.");
  if (!$("suTerms").checked) return show(msg, "وافق على شروط الاستخدام لإكمال التسجيل.");
  btn.disabled = true; btn.textContent = "جاري إنشاء الحساب…";
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await setDoc(doc(db, "users", cred.user.uid), { name, role, createdAt: serverTimestamp() });
    await setDoc(doc(db, "users", cred.user.uid, "private", "contact"), { phone });
    $("helloName").textContent = "مرحباً " + name;
    location.hash = "#home";
  } catch(err){ show(msg, errText(err.code)); }
  btn.disabled = false; btn.textContent = "إنشاء الحساب";
});

/* ---------- العروض ---------- */
const TYPES = ["الكل","شقة","فيلا","دور","روف","أرض","مزرعة","فندق","استراحة","عمارة","محل","مكتب","مستودع"];
let filter = { deal:"all", type:"الكل", q:"" };
let listings = [];

$("typeChips").innerHTML = TYPES.map(t =>
  `<button type="button" data-type="${t}" aria-pressed="${t==="الكل"}">${t}</button>`).join("");
$("typeChips").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter.type = b.dataset.type;
  $("typeChips").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("dealSeg").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter.deal = b.dataset.deal;
  $("dealSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("q").addEventListener("input", (e) => { filter.q = e.target.value.trim(); render(); });
$("addBtn").addEventListener("click", () => {
  if (!currentUser) { location.hash = "#login"; return; }
  alert("شاشة «أضف عقارك» هي الخطوة الجاية في البناء.");
});

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n) => Number(n || 0).toLocaleString("en-US");
const houseIcon = `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#3CBFBA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>`;

function card(l){
  const photo = Array.isArray(l.photos) && l.photos[0]
    ? `<img src="${esc(l.photos[0])}" alt="" loading="lazy">` : houseIcon;
  const specs = [
    l.rooms ? `${esc(l.rooms)} غرف` : "",
    l.baths ? `${esc(l.baths)} دورات` : "",
    l.area ? `${num(l.area)} م²` : ""
  ].filter(Boolean).map(s => `<span>${s}</span>`).join("");
  return `<article class="card">
    <div class="ph">${photo}
      <div class="badges"><span class="pill deal">${l.deal === "rent" ? "للإيجار" : "للبيع"}</span><span class="pill owner">من المالك</span></div>
    </div>
    <div class="body">
      <div class="price">${num(l.price)}<small>ريال${l.deal === "rent" ? " / سنوياً" : ""}</small></div>
      <h3>${esc(l.title)}</h3>
      <div class="meta">${esc(l.city)}${l.district ? "، " + esc(l.district) : ""}</div>
      <div class="specs">${specs}</div>
    </div>
  </article>`;
}

function render(){
  const q = filter.q;
  const shown = listings.filter(l =>
    (filter.deal === "all" || l.deal === filter.deal) &&
    (filter.type === "الكل" || (l.type || "").includes(filter.type)) &&
    (!q || [l.title, l.city, l.district, l.type].some(v => (v || "").includes(q))));
  $("count").textContent = shown.length ? `${shown.length} عرض` : "";
  $("list").innerHTML = shown.length ? shown.map(card).join("") :
    `<div class="empty"><p>${listings.length ? "ما فيه عروض تطابق بحثك. جرّب نوع أو مدينة ثانية." : "ما فيه عقارات منشورة للحين. كن أول مالك يعرض عقاره."}</p>
     ${listings.length ? "" : '<button type="button" class="primary" style="padding:0 20px" onclick="document.getElementById(\'addBtn\').click()">أضف عقارك</button>'}</div>`;
}

async function loadListings(){
  try {
    const snap = await getDocs(query(collection(db, "listings"), orderBy("createdAt","desc"), limit(50)));
    listings = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(l => (l.status || "active") === "active");
    render();
  } catch(err){
    $("list").innerHTML = `<div class="empty"><p>ما قدرنا نحمّل العروض. تأكد من الإنترنت ثم حدّث الصفحة.</p></div>`;
    console.error(err);
  }
}
loadListings();
</script>
